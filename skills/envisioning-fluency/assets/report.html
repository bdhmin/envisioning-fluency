<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Envisioning fluency</title>
<style>
  /* One file, no network: the drive's paper-and-ink tokens, each colour a
     light-dark() pair so the report follows the reader's scheme. */
  :root {
    color-scheme: light dark;
    --ink: light-dark(#111111, #e8e6e1);
    --muted: light-dark(#5a5a5a, #a3a7ab);
    --faint: light-dark(#8a8a8a, #71767a);
    --label: light-dark(#2b2b2b, #d6d4cf);
    --line: light-dark(#e6e2d8, #272c30);
    --paper: light-dark(#fafaf7, #16181a);
    --paper-2: light-dark(#f3f1ea, #1e2124);
    --paper-3: light-dark(#eceae1, #262a2e);
    --card: light-dark(#ffffff, #1c1f22);
    --accent: light-dark(#9bb6cf, #7fa8c9);
    --accent-ink: light-dark(#738698, #9dc0dc);
    --danger: light-dark(#b4533e, #e08a74);
    /* Four colours from the drive's family, one per part of the range, and
       each means the same thing everywhere on the page: green is what you
       build, travel blue how you ask, terracotta what you borrow, gold your edges.
       How full a mark is says the level: solid fluent, tinted growing,
       an outline rare. */
    --build: light-dark(#2f6f5b, #6fbfa2);
    --ask: light-dark(#3d6b8a, #7aa0b8);
    --borrow: light-dark(#c45c3e, #e08a6a);
    --edge: light-dark(#a07a2c, #d9b25e);
    --hue: var(--ask);
    --shadow-rest: 0 1px 2px light-dark(rgba(74,66,52,.06), rgba(0,0,0,.40)), 0 6px 16px light-dark(rgba(74,66,52,.08), rgba(0,0,0,.28));
    --r: 12px; --r-sm: 8px; --pill: 999px;
    --ease: cubic-bezier(.22, .61, .36, 1);
    --ui: "Google Sans", Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  }
  [data-fam="build"] { --hue: var(--build); }
  [data-fam="ask"] { --hue: var(--ask); }
  [data-fam="borrow"] { --hue: var(--borrow); }
  [data-fam="edge"] { --hue: var(--edge); }
  :root, [data-fam] {
    --hue-tint: color-mix(in srgb, var(--hue) 34%, var(--card));
    --hue-wash: color-mix(in srgb, var(--hue) 9%, var(--card));
    --hue-text: color-mix(in srgb, var(--hue) 84%, var(--ink));
  }
  html { container: page / inline-size; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--card); color: var(--ink); font: 14px/1.5 var(--ui); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; }
  main { max-width: 64rem; margin: 0 auto; padding: 2.75rem 2.75rem 6rem; }
  h1 { margin: 0 0 .35rem; font-size: 1.65rem; font-weight: 500; letter-spacing: -.015em; }
  .lede { margin: 0 0 1.25rem; max-width: 42rem; color: var(--muted); font-size: 1.02rem; }
  section { margin-top: 2.75rem; }
  h2 { margin: 0 0 .15rem; font-size: 1.15rem; font-weight: 500; letter-spacing: -.015em; }
  .sec-d { margin: 0 0 1rem; color: var(--muted); max-width: 42rem; }
  h3.k { margin: 0 0 .25rem; font-size: 13px; font-weight: 600; color: var(--label); }
  figure { margin: 0 0 1.5rem; }
  figcaption p { margin: .1rem 0 .65rem; color: var(--muted); }

  /* Segmented controls: words on a recessed track; the chosen one lifted. */
  .seg { display: inline-flex; flex: none; padding: 2px; border-radius: var(--pill); background: var(--paper-2); }
  .seg button { border: 0; background: transparent; color: var(--muted); cursor: pointer; padding: .12rem .55rem; border-radius: var(--pill); font-size: 12px; transition: background .2s var(--ease), color .2s var(--ease); }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px light-dark(rgba(74,66,52,.14), rgba(0,0,0,.5)); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .show { position: sticky; top: .65rem; z-index: 5; width: fit-content; display: flex; align-items: center; gap: .55rem; padding: .3rem .35rem .3rem .85rem; border: 1px solid var(--line); border-radius: var(--pill); background: light-dark(rgba(250,250,247,.78), rgba(22,24,26,.78)); backdrop-filter: blur(20px); box-shadow: var(--shadow-rest); }
  .show .seg button { font-size: 13px; padding: .2rem .7rem; }
  .show b { font-size: 13px; font-weight: 600; color: var(--label); }
  @media (prefers-reduced-transparency: reduce) { .show { background: var(--paper); backdrop-filter: none; } }

  .verdict { margin: 0 0 1.5rem; max-width: 44rem; font-family: var(--serif); font-size: 1.1rem; line-height: 1.6; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(7rem, 1fr)); gap: .75rem 1rem; margin: 0 0 1.5rem; }
  .stats div { border-top: 1px solid var(--line); padding-top: .5rem; }
  .stats dt { font-size: .78rem; color: var(--muted); }
  .stats dd { margin: 0; font-size: 1.3rem; font-weight: 500; font-variant-numeric: tabular-nums; }
  .pull { display: grid; grid-template-columns: repeat(auto-fit, minmax(14rem, 1fr)); gap: .75rem; }
  .pull div { background: var(--hue-wash); border-radius: var(--r); padding: .85rem 1rem; }
  .pull h3 { display: flex; align-items: center; gap: .4rem; }
  .pull p { margin: 0; }

  .map { display: grid; gap: 1rem; }
  .fam-g { display: grid; gap: .4rem; }
  .fam-h { display: flex; align-items: baseline; gap: .45rem; margin: 0; font-size: 13px; }
  .fam-h b { font-weight: 600; color: var(--hue-text); }
  .fam-h span { color: var(--muted); }
  .disc { display: inline-block; flex: none; width: .6rem; height: .6rem; border-radius: 50%; background: var(--hue); }
  .map-row { display: grid; grid-template-columns: 8.5rem fit-content(36rem) minmax(0, 1fr); align-items: center; gap: .75rem; font-size: 13px; }
  .tally { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .map-row a { color: var(--ink); text-decoration: none; }
  .cells { display: flex; flex-wrap: wrap; gap: 4px; }
  .cells i { width: 18px; height: 18px; border-radius: 4px; border: 1px solid var(--line); background: var(--paper); }
  .cells i.fluent { background: var(--hue); border-color: transparent; }
  .cells i.growing { background: var(--hue-tint); border-color: transparent; }
  .legend { display: flex; align-items: center; flex-wrap: wrap; gap: .35rem; margin: .65rem 0 0; font-size: .78rem; color: var(--muted); }
  .legend i { width: 12px; height: 12px; border-radius: 3px; margin-left: .6rem; }
  .legend i:first-child { margin-left: 0; }
  .legend .key { display: inline-flex; align-items: center; gap: .3rem; margin-left: .7rem; }
  .legend .key .disc { width: .6rem; height: .6rem; margin: 0; border-radius: 50%; }

  .days { overflow: hidden; display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; height: 8.5rem; }
  .day { display: flex; flex-direction: column; justify-content: flex-end; min-width: 0; }
  .day .b { min-height: 2px; border-radius: 3px 3px 1px 1px; background: var(--paper-3); }
  .day.pk .b { background: color-mix(in srgb, var(--muted) 55%, var(--card)); }
  /* Under each day, a dot for each entry whose line you wrote that day. */
  .dots { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 3px; margin-top: .3rem; }
  .dots span { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--hue); }
  .dots i.growing { background: var(--hue-tint); }
  .dots i.rare { background: var(--card); box-shadow: inset 0 0 0 1.25px var(--hue); }
  .day .n, .day .d { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .day .n { text-align: center; }
  .day .d { height: 1.2rem; padding-top: .2rem; border-top: 1px solid var(--line); }

  /* Cards: one hairline all the way round; the level is a word at the foot. */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(17.5rem, 1fr)); gap: .75rem; }
  .it { display: flex; flex-direction: column; gap: .45rem; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: .85rem 1rem .9rem; }
  .it[data-level="rare"] { background: var(--paper); }
  .it h4 { margin: 0; font-size: 14px; font-weight: 500; }
  .it p { margin: 0; color: var(--muted); }
  .it .seg { align-self: flex-start; margin-top: auto; }
  .glyph { padding: .55rem .5rem; border-radius: var(--r-sm); background: var(--paper); }
  .it[data-level="fluent"] .glyph { background: var(--hue-wash); }
  .it[data-level="rare"] .glyph { background: var(--card); }
  .eyebrow { display: flex; align-items: center; gap: .4rem; margin: 0 0 .3rem; font-size: 13px; font-weight: 600; color: var(--hue-text); }
  .lvl { display: inline-block; width: .55rem; height: .55rem; margin-right: .4rem; border-radius: 2px; vertical-align: .05em; background: var(--hue); }
  .it[data-level="growing"] .lvl { background: var(--hue-tint); }
  .it[data-level="rare"] .lvl { background: transparent; box-shadow: inset 0 0 0 1.25px var(--hue); }
  .glyph svg { display: block; width: 100%; height: auto; max-height: 5.5rem; }
  .q p { font-family: var(--serif); font-size: .98rem; line-height: 1.45; color: var(--ink) !important; }
  .q p::before, .r-q::before, .names dt::before { content: "\201C"; }
  .q p::after, .r-q::after, .names dt::after { content: "\201D"; }
  .q cite { display: block; margin-top: .3rem; font-style: normal; font-size: .78rem; color: var(--muted); }
  .next { padding: .55rem .7rem; border-radius: var(--r-sm); background: var(--hue-wash); color: var(--ink) !important; }
  .next b { font-weight: 600; color: var(--hue-text); margin-right: .25rem; }
  main[data-show="fluent"] .it:not([data-level="fluent"]),
  main[data-show="growing"] .it:not([data-level="growing"]),
  main[data-show="rare"] .it:not([data-level="rare"]) { display: none; }

  /* The drawings: greys from the ink, one accent, danger only to strike. */
  svg * { vector-effect: non-scaling-stroke; stroke-linecap: round; stroke-linejoin: round; }
  .ln { fill: none; stroke: var(--muted); stroke-width: 1.5; }
  .lt { fill: none; stroke: var(--faint); stroke-width: 1; }
  .fl { fill: var(--paper-3); stroke: none; }
  .fc { fill: var(--card); stroke: var(--line); stroke-width: 1; }
  .ac { fill: var(--hue); stroke: none; }
  .a2 { fill: var(--hue-tint); stroke: none; }
  .as { fill: none; stroke: var(--hue); stroke-width: 1.5; }
  .dash { stroke-dasharray: 3 3; }
  .bad { fill: none; stroke: var(--danger); stroke-width: 1.75; }

  .box { margin-top: .75rem; border: 1px solid var(--line); border-radius: var(--r); padding: .85rem 1rem .4rem; }
  .box ul, .box dl { list-style: none; margin: 0; padding: 0; }
  .box li, .names dl > div { display: grid; gap: .25rem 1rem; padding: .45rem 0; border-top: 1px solid var(--line); align-items: baseline; }
  .box li { grid-template-columns: 11rem minmax(0, 1fr) auto; }
  .names dl > div { grid-template-columns: minmax(0, 24rem) 2rem minmax(0, 1fr); align-items: center; }
  .names dd { display: flex; align-items: center; gap: .6rem; }
  .names dd svg, .bars svg { flex: none; width: 2.6rem; height: auto; }
  .names .arrow { color: var(--faint); }
  .r-q, .names dt { font-family: var(--serif); color: var(--muted); }
  .r-d { font-size: .78rem; color: var(--muted); }
  .names dd { margin: 0; font-weight: 500; color: var(--hue-text); }

  .bars { list-style: none; margin: .35rem 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .bars li { position: relative; isolation: isolate; display: flex; justify-content: space-between; padding: .12rem .45rem; font-size: 13px; }
  .bars li::before { content: ""; position: absolute; inset: 0 auto 0 0; z-index: -1; width: var(--w); border-radius: 4px; background: color-mix(in srgb, var(--hue) 26%, transparent); }
  .bars li > span:first-child { display: flex; align-items: center; gap: .5rem; min-width: 0; }
  .bars.glyphs li { padding-top: .2rem; padding-bottom: .2rem; }
  .bars .n { color: var(--muted); font-variant-numeric: tabular-nums; }

  .steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .45rem; counter-reset: st; }
  .steps li { display: flex; flex-direction: column; gap: .15rem; padding: .6rem .65rem; border: 1px solid var(--line); border-radius: var(--r-sm); counter-increment: st; }
  .steps li::before { content: counter(st); font-size: .78rem; color: var(--muted); }
  .steps li::before { color: var(--hue-text); font-weight: 600; }
  .steps li.in { background: var(--hue-wash); border-color: var(--hue-tint); }
  .steps b { font-weight: 500; font-size: 13px; }
  .steps span { font-size: 12px; color: var(--muted); }
  .loop-note { margin: .45rem 0 0; font-size: .78rem; color: var(--muted); }

  .links { display: grid; grid-template-columns: minmax(0, 13rem) minmax(3rem, 1fr) minmax(0, 13rem); }
  .links ul { list-style: none; margin: 0; padding: 0; }
  .links li { height: 2rem; line-height: 2rem; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .links .l { text-align: right; padding-right: .6rem; font-weight: 500; color: var(--hue-text); }
  .links .r li { padding-left: .6rem; color: var(--ink); }
  .links svg { width: 100%; }
  .lk { fill: none; stroke: color-mix(in srgb, var(--hue) 55%, var(--card)); stroke-width: 1.25; }

  /* Which project each entry's evidence comes from, by part of the range. */
  .proj { display: grid; grid-template-columns: minmax(0, 11rem) repeat(4, minmax(0, 1fr)); gap: .35rem .75rem; align-items: center; font-size: 13px; }
  .proj .ph { display: flex; align-items: center; gap: .35rem; font-size: 12px; font-weight: 600; color: var(--hue-text); padding-bottom: .2rem; border-bottom: 1px solid var(--line); }
  .proj .pn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj .cells i { width: 14px; height: 14px; border-radius: 3px; }

  /* Sending. A bar pinned to the foot of the window, so whoever reads the
     report always has the choice in view; it floats, so it is glass, one
     layer deep. Pressing it opens a sheet out of the bar that says exactly
     what would go before anything does. Send is the page's one filled pill. */
  .send { position: fixed; z-index: 20; left: 50%; bottom: calc(.9rem + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    width: min(36rem, calc(100vw - 1.5rem)); border: 1px solid var(--line); border-radius: 14px;
    background: light-dark(rgba(250,250,247,.88), rgba(22,24,26,.88)); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: inset 0 1px 0 light-dark(rgba(255,255,255,.7), rgba(255,255,255,.06)), var(--shadow-rest); }
  .send[hidden] { display: none; }
  .send-row { display: flex; align-items: center; gap: .75rem; padding: .55rem .55rem .55rem 1rem; }
  .send-row p { flex: 1; margin: 0; min-width: 0; font-size: 13px; color: var(--muted); }
  .send-row p b { font-weight: 500; color: var(--ink); }
  .pill { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: var(--pill); padding: .4rem .95rem; cursor: pointer; font-size: 13px; transition: background .11s var(--ease); }
  .pill:hover { background: var(--paper-2); }
  .pill:active { background: var(--paper-3); }
  .pill.go { background: var(--ink); color: var(--paper); border-color: transparent; font-weight: 500; }
  .pill.go:hover { background: color-mix(in srgb, var(--ink) 86%, var(--paper)); }
  .pill.go:active { background: color-mix(in srgb, var(--ink) 74%, var(--paper)); }
  .pill:disabled { opacity: .5; cursor: default; }
  a.pill { color: var(--ink); text-decoration: none; }
  .pill:focus-visible, .send summary:focus-visible, .send input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sheet { display: none; padding: .9rem 1rem .2rem; border-bottom: 1px solid var(--line); max-height: min(60dvh, 30rem); overflow: auto; }
  .send[data-open] .sheet { display: block; animation: rise .2s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(3px); } }
  .sheet h2 { font-size: 1rem; margin-bottom: .55rem; }
  .sheet dl { margin: 0; }
  .sheet dl > div { padding: .45rem 0; border-top: 1px solid var(--line); }
  .sheet dt { font-size: 13px; font-weight: 600; color: var(--label); }
  .sheet dd { margin: .1rem 0 0; color: var(--muted); }
  .sheet label { display: flex; gap: .5rem; align-items: baseline; padding: .55rem 0 .7rem; border-top: 1px solid var(--line); cursor: pointer; }
  .sheet label span { color: var(--muted); }
  .sheet label b { font-weight: 500; color: var(--ink); }
  .sheet code { font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--paper-2); border-radius: 4px; padding: .1rem .3rem; word-break: break-all; }
  .send[data-state="sent"] .send-row p { color: var(--ink); }
  .send-row p.err { color: var(--danger); }
  @media (prefers-reduced-transparency: reduce) { .send { background: var(--paper); backdrop-filter: none; -webkit-backdrop-filter: none; } }
  @media (pointer: coarse) { .pill { padding: .65rem 1.1rem; } .sheet input { width: 1.25rem; height: 1.25rem; } }
  body.has-send main { padding-bottom: 9rem; }

  @container page (max-width: 620px) {
    main { padding: 1.5rem 1.1rem 6rem; }
    .send-row { flex-wrap: wrap; }
    .send-row p { flex-basis: 100%; }
    .send-row .pill { flex: 1; }
    .grid { grid-template-columns: 1fr; }
    .map-row { grid-template-columns: minmax(0, 1fr) auto; gap: .2rem .5rem; }
    .map-row .cells { grid-column: 1 / -1; grid-row: 2; }
    .proj { grid-template-columns: minmax(0, 6.5rem) repeat(4, minmax(0, 1fr)); gap: .35rem .4rem; }
    .proj .ph span { display: none; }
    .proj .cells i { width: 10px; height: 10px; }
    .box li { grid-template-columns: 1fr; }
    .names dl > div { grid-template-columns: minmax(0, 1fr) 1rem minmax(0, .8fr); gap: .25rem .5rem; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main data-show="all"></main>
<aside class="send" id="send" hidden aria-label="Send this report"></aside>
<script type="application/json" id="data">/*__DATA__*/null</script>
<script type="application/json" id="collector">/*__SEND__*/null</script>
<script>
// The report draws itself from the JSON above. The levels you change are
// kept in this browser (localStorage), keyed by this report's name and date.
(() => {
  const data = JSON.parse(document.getElementById('data').textContent);
  const main = document.querySelector('main');
  if (!data) { main.textContent = 'This report has no data yet. Run render.py.'; return; }
  const a = data.analysis, s = data.stats;
  const key = `ef-levels:${a.name || ''}:${a.generated || ''}`;
  const saved = JSON.parse(localStorage.getItem(key) || '{}');
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const num = (n) => Number(n || 0).toLocaleString('en-US');
  const LEVELS = [['fluent', 'Fluent'], ['growing', 'Growing'], ['rare', 'Rare']];
  const SECTIONS = [
    ['kinds', 'Kinds of UI you build', 'The genres your work falls into.', 'Kinds of UI', 'build'],
    ['features', 'Features you generate', 'What you add to an app once it exists.', 'Features', 'build'],
    ['interaction', 'Interaction techniques', 'How the things you build are handled.', 'Interaction', 'build'],
    ['prompting', 'How you prompt', 'The moves you make when you ask an agent for an interface.', 'Prompting', 'ask'],
    ['style', 'Design language', 'What you ask a page to look and feel like, and what you send back.', 'Design language', 'ask'],
    ['metaphors', 'Metaphors and borrowed products', 'The apps, sites and objects you bring in as references. Here the level says how often you reach for one.', 'References', 'borrow'],
    ['edges', 'Edges of the arsenal', 'What you rarely reach for, and what would widen the range.', 'Edges', 'edge'],
  ];
  // The four parts of the range, each in its own colour on every chart.
  const FAMS = [
    ['build', 'Building', 'what you make'],
    ['ask', 'Asking', 'how you ask for it'],
    ['borrow', 'Borrowing', 'what you bring in from elsewhere'],
    ['edge', 'Edges', 'where the range could grow'],
  ];
  const famOf = Object.fromEntries(SECTIONS.map(([k, , , , f]) => [k, f]));
  const famName = Object.fromEntries(FAMS.map(([f, n]) => [f, n]));
  const disc = '<i class="disc" aria-hidden="true"></i>';
  // A small picture of each pattern the vocabulary counts, so a name you
  // never use comes with what it looks like. Same classes as the sketches.
  const G = {
    'popover': "<rect class='fl' x='4' y='15' width='11' height='5' rx='2'/><rect class='fc' x='9' y='2' width='24' height='10' rx='2'/><path class='ac' d='M12 12l2.5 2.5L17 12z'/>",
    'breadcrumb': "<rect class='fl' x='1' y='8' width='8' height='6' rx='1.5'/><path class='ln' d='M11 9l2 2-2 2'/><rect class='fl' x='15' y='8' width='8' height='6' rx='1.5'/><path class='ln' d='M25 9l2 2-2 2'/><rect class='ac' x='29' y='8' width='6' height='6' rx='1.5'/>",
    'drawer': "<rect class='fc' x='1' y='2' width='34' height='18' rx='2'/><rect class='a2' x='22' y='2' width='13' height='18'/><line class='as' x1='22' y1='2' x2='22' y2='20'/>",
    'placeholder': "<rect class='fc' x='2' y='6' width='32' height='10' rx='2'/><line class='lt' x1='6' y1='11' x2='19' y2='11'/><line class='as' x1='6' y1='8.5' x2='6' y2='13.5'/>",
    'chevron': "<rect class='fl' x='2' y='6' width='22' height='10' rx='2'/><path class='as' d='M27 8l4 3-4 3'/>",
    'toast': "<rect class='fc' x='1' y='2' width='34' height='18' rx='2'/><rect class='ac' x='9' y='13.5' width='18' height='4.5' rx='2.25'/>",
    'reflow': "<rect class='fl' x='1' y='6' width='6' height='10' rx='1'/><rect class='fl' x='8' y='6' width='6' height='10' rx='1'/><path class='lt' d='M17 11h4'/><rect class='a2' x='24' y='2' width='11' height='8' rx='1'/><rect class='a2' x='24' y='12' width='11' height='8' rx='1'/>",
    'progressive disclosure': "<rect class='fl' x='1' y='2' width='34' height='5' rx='1.5'/><path class='as' d='M4 3.5l1.5 1.5L7 3.5'/><rect class='a2' x='6' y='9' width='29' height='4' rx='1'/><rect class='a2' x='6' y='15' width='29' height='4' rx='1'/>",
    'modal': "<rect class='fl' x='1' y='2' width='34' height='18' rx='2'/><rect class='fc' x='9' y='5' width='18' height='12' rx='2'/><rect class='ac' x='20' y='13' width='5' height='2.5' rx='1.25'/>",
    'segmented control': "<rect class='fl' x='2' y='7' width='32' height='8' rx='4'/><rect class='ac' x='3' y='8' width='10' height='6' rx='3'/>",
    'empty state': "<rect class='fc' x='1' y='2' width='34' height='18' rx='2'/><rect class='as dash' x='10' y='6' width='16' height='10' rx='2'/>",
    'drag handle': "<circle class='ac' cx='5' cy='7' r='1.2'/><circle class='ac' cx='9' cy='7' r='1.2'/><circle class='ac' cx='5' cy='11' r='1.2'/><circle class='ac' cx='9' cy='11' r='1.2'/><circle class='ac' cx='5' cy='15' r='1.2'/><circle class='ac' cx='9' cy='15' r='1.2'/><rect class='fl' x='13' y='5' width='21' height='12' rx='2'/>",
    'spring': "<line class='lt' x1='2' y1='7' x2='34' y2='7'/><path class='as' d='M2 19 C9 19 11 2 18 4 S25 8.5 34 7'/>",
    'stagger': "<rect class='a2' x='2' y='2' width='16' height='4' rx='1'/><rect class='a2' x='7' y='9' width='16' height='4' rx='1'/><rect class='ac' x='12' y='16' width='16' height='4' rx='1'/>",
    'drill-down': "<rect class='fl' x='1' y='4' width='12' height='14' rx='1.5'/><rect class='ac' x='3' y='6' width='4' height='4' rx='1'/><path class='lt' d='M15 11h4'/><rect class='fc' x='21' y='2' width='14' height='18' rx='2'/><rect class='a2' x='23' y='4' width='10' height='6' rx='1'/>",
    'semantic zoom': "<circle class='ac' cx='4' cy='8' r='1.2'/><circle class='ac' cx='9' cy='13' r='1.2'/><circle class='ac' cx='6' cy='16' r='1.2'/><path class='lt' d='M13 11h4'/><rect class='fc' x='20' y='3' width='15' height='16' rx='2'/><line class='ln' x1='23' y1='8' x2='32' y2='8'/><line class='lt' x1='23' y1='12' x2='30' y2='12'/><line class='lt' x1='23' y1='15' x2='31' y2='15'/>",
    'affordance': "<rect class='fc' x='3' y='5' width='20' height='9' rx='4.5'/><path class='ac' d='M22 11l8 6-3.4.6 1.9 3.5-1.6.8-1.9-3.5-2.6 2.2z'/>",
    'skeleton': "<rect class='fl' x='2' y='3' width='8' height='8' rx='2'/><rect class='fl' x='12' y='4' width='22' height='2.5' rx='1.25'/><rect class='a2' x='12' y='8.5' width='15' height='2.5' rx='1.25'/><rect class='fl' x='2' y='14' width='32' height='2.5' rx='1.25'/><rect class='fl' x='2' y='18' width='24' height='2.5' rx='1.25'/>",
    'command palette': "<rect class='fl' x='1' y='2' width='34' height='18' rx='2'/><rect class='fc' x='7' y='4' width='22' height='14' rx='2'/><rect class='ac' x='9' y='6' width='18' height='3' rx='1'/><line class='lt' x1='9' y1='12' x2='25' y2='12'/><line class='lt' x1='9' y1='15' x2='22' y2='15'/>",
    'focus ring': "<rect class='fc' x='6' y='6' width='24' height='10' rx='3'/><rect class='as' x='3.5' y='3.5' width='29' height='15' rx='5'/>",
    'overview ruler': "<rect class='fl' x='1' y='2' width='27' height='18' rx='1.5'/><rect class='fc' x='30' y='2' width='5' height='18' rx='1'/><rect class='ac' x='30' y='6' width='5' height='1.6'/><rect class='ac' x='30' y='13' width='5' height='1.6'/>",
  };
  const glyph = (name) => { const g = G[String(name || '').toLowerCase().trim()]; return g ? `<svg viewBox="0 0 36 22" aria-hidden="true">${g}</svg>` : ''; };
  const entries = (k) => (a.sections && a.sections[k]) || [];
  const levelOf = (k, i, e) => saved[`${k}:${i}`] || e.level || 'growing';

  const seg = (k, i, level) => `<span class="seg" role="group" aria-label="Level">${LEVELS.map(([v, l]) =>
    `<button type="button" data-k="${k}" data-i="${i}" data-v="${v}" aria-pressed="${v === level}">${l}</button>`).join('')}</span>`;
  const card = (k, e, i) => {
    const level = levelOf(k, i, e);
    return `<article class="it" data-level="${level}" id="${k}-${i}">
      ${e.sketch ? `<div class="glyph" aria-hidden="true"><svg viewBox="0 0 160 72">${e.sketch}</svg></div>` : ''}
      <h4><i class="lvl" aria-hidden="true"></i>${esc(e.title)}</h4><p>${esc(e.desc)}</p>
      ${e.quote ? `<blockquote class="q" style="margin:0"><p>${esc(e.quote)}</p><cite>${esc([e.where, e.date].filter(Boolean).join(' · '))}</cite></blockquote>` : ''}
      ${e.next ? `<p class="next"><b>Try next</b>${esc(e.next)}</p>` : ''}
      ${seg(k, i, level)}</article>`;
  };
  const bars = (obj, cls = '') => {
    const rows = Object.entries(obj || {}).sort((x, y) => y[1] - x[1]).slice(0, 18);
    const max = Math.max(1, ...rows.map((r) => r[1]));
    const pics = cls.includes('glyphs');
    return `<ol class="bars ${cls}">${rows.map(([w, n]) => `<li style="--w:${n ? Math.max(2, Math.round(n / max * 100)) : 0}%"><span>${pics ? glyph(w) : ''}${esc(w)}</span><span class="n">${n}</span></li>`).join('')}</ol>`;
  };
  // Every entry, with where it lives, so one level change can find each mark of it.
  const all = SECTIONS.flatMap(([k]) => entries(k).map((e, i) => ({ k, i, e, fam: famOf[k] })));
  const mark = (x) => `<i class="${levelOf(x.k, x.i, x.e)}" data-cell="${x.k}:${x.i}" data-fam="${x.fam}" title="${esc(x.e.title)}"></i>`;
  const tally = (k) => { const n = entries(k).filter((e, i) => levelOf(k, i, e) === 'fluent').length; return `${n} of ${entries(k).length} fluent`; };

  // Prompts per day, with the four busiest named, and under each day a dot
  // for every entry whose line you wrote that day.
  const days = Object.entries(s.per_day || {});
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const dayKey = (d) => { const m = /^\d{4}-(\d\d)-(\d\d)$/.exec(d); return m ? `${+m[2]} ${MON[+m[1] - 1]}` : d; };
  const onDay = {};
  for (const x of all) { const d = String(x.e.date || '').trim().replace(/^0/, ''); if (d) (onDay[d] ||= []).push(x); }
  const dated = days.some(([d]) => onDay[dayKey(d)]);
  const maxDay = Math.max(1, ...days.map((d) => d[1]));
  const peaks = new Set(days.slice().sort((x, y) => y[1] - x[1]).slice(0, 4).map((d) => d[0]));
  const every = Math.max(1, Math.ceil(days.length / 8));
  const dayChart = days.length ? `<figure><h3 class="k">When you prompted</h3><figcaption><p>Prompts per day, ${esc(s.first)} to ${esc(s.last)}.</p></figcaption>
    <div class="days">${days.map(([d, n], i) => `<div class="day${peaks.has(d) ? ' pk' : ''}"><span class="n">${peaks.has(d) ? n : ''}</span><span class="b" style="height:${n / maxDay * 72}%"></span><span class="d">${i % every || i > days.length - 3 ? '' : d.slice(5)}</span></div>`).join('')}</div>
    ${dated ? `<div class="dots" aria-hidden="true">${days.map(([d]) => `<span>${(onDay[dayKey(d)] || []).map((x) => mark(x)).join('')}</span>`).join('')}</div>
    <p class="legend">Each dot is an entry below, on the day you wrote the line behind it.${FAMS.map(([f, n]) => `<span class="key" data-fam="${f}">${disc}${n}</span>`).join('')}</p>` : ''}</figure>` : '';

  const map = `<figure><h3 class="k">Map of the arsenal</h3><figcaption><p>One square per entry. Its colour is the part of your range it belongs to, the same on every chart here; how full it is says the level.</p></figcaption><div class="map">${FAMS.map(([f, name, says]) =>
    `<div class="fam-g" data-fam="${f}"><p class="fam-h">${disc}<b>${name}</b><span>${says}</span></p>${SECTIONS.filter((sec) => sec[4] === f).map(([k, , , short]) =>
      `<div class="map-row"><a href="#${k}">${short}</a><span class="cells">${entries(k).map((e, i) => mark({ k, i, e, fam: f })).join('')}</span><span class="tally" data-tally="${k}">${tally(k)}</span></div>`).join('')}</div>`).join('')}</div>
    <p class="legend"><i style="background:var(--muted)"></i>Fluent<i style="background:color-mix(in srgb, var(--muted) 34%, var(--card))"></i>Growing<i style="background:var(--card);box-shadow:inset 0 0 0 1.25px var(--muted)"></i>Rare</p></figure>`;

  // Which project taught what: each entry under the project its line comes from.
  const projects = (() => {
    const by = new Map();
    for (const x of all) { const w = String(x.e.where || '').trim(); if (!w) continue; if (!by.has(w)) by.set(w, []); by.get(w).push(x); }
    const rows = [...by.entries()].sort((p, q) => q[1].length - p[1].length).slice(0, 10);
    if (rows.length < 2) return '';
    return `<figure><h3 class="k">Where your range came from</h3><figcaption><p>Your projects, with a square for each entry whose evidence comes from it. A row in every colour taught you a lot at once; a colour that sits in one row rests on that one project.</p></figcaption>
      <div class="proj"><span></span>${FAMS.map(([f, n]) => `<span class="ph" data-fam="${f}">${disc}<span>${n}</span></span>`).join('')}
      ${rows.map(([w, xs]) => `<span class="pn" title="${esc(w)}">${esc(w)}</span>${FAMS.map(([f]) => `<span class="cells" data-fam="${f}">${xs.filter((x) => x.fam === f).map((x) => mark(x)).join('')}</span>`).join('')}`).join('')}</div></figure>`;
  })();

  const loop = (a.loop || []).length ? `<figure><h3 class="k">The loop you run</h3><figcaption><p>How most of your builds go, from first idea to shipped.</p></figcaption>
    <ol class="steps">${a.loop.map((st) => `<li class="${st.repeats ? 'in' : ''}"><b>${esc(st.step)}</b><span>${esc(st.detail)}</span></li>`).join('')}</ol>
    ${a.loop.some((st) => st.repeats) ? '<p class="loop-note">The tinted steps repeat until it looks right.</p>' : ''}</figure>` : '';

  const links = (() => {
    const pairs = a.references || [];
    if (!pairs.length) return '';
    const L = [...new Set(pairs.map((p) => p.from))], R = [...new Set(pairs.map((p) => p.to))];
    const rows = Math.max(L.length, R.length), offL = rows - L.length, offR = rows - R.length;
    const y = (i, off) => 2 * i + 1 + off;
    return `<figure><h3 class="k">Where each reference landed</h3><figcaption><p>On the left, what you borrowed from; on the right, what of yours it shaped.</p></figcaption>
      <div class="links"><ul class="l" style="padding-top:${offL}rem">${L.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>
      <svg viewBox="0 0 100 ${rows * 2}" preserveAspectRatio="none" style="height:${rows * 2}rem" aria-hidden="true">${pairs.map((p) => {
        const a1 = y(L.indexOf(p.from), offL), b1 = y(R.indexOf(p.to), offR);
        return `<path class="lk" d="M0 ${a1} C50 ${a1} 50 ${b1} 100 ${b1}"/>`; }).join('')}</svg>
      <ul class="r" style="padding-top:${offR}rem">${R.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></div></figure>`;
  })();

  const refusals = (a.refusals || []).length ? `<div class="box"><h3 class="k">What you send back</h3><ul>${a.refusals.map((r) =>
    `<li><span>${esc(r.name)}</span><span class="r-q">${esc(r.quote)}</span><span class="r-d">${esc(r.date)}</span></li>`).join('')}</ul></div>` : '';
  const names = (a.names || []).length ? `<div class="box names" data-fam="edge"><h3 class="k">Where a name would help</h3><dl>${a.names.map((n) =>
    `<div><dt>${esc(n.said)}</dt><span class="arrow" aria-hidden="true">→</span><dd>${n.sketch ? `<svg viewBox="0 0 160 72" aria-hidden="true" style="width:4.5rem">${n.sketch}</svg>` : glyph(n.name)}${esc(n.name)}</dd></div>`).join('')}</dl></div>` : '';

  main.innerHTML = `
    <h1>${esc(a.name ? `${a.name}'s envisioning fluency` : 'Envisioning fluency')}</h1>
    <p class="lede">What you can picture, ask for and get built, read from your own prompts to coding agents. Each level is a judgement from that evidence; change any one you disagree with.</p>
    <nav class="show" aria-label="Show entries by level"><b>Show</b><span class="seg">${[['all', 'All'], ...LEVELS].map(([v, l]) => `<button type="button" data-show="${v}" aria-pressed="${v === 'all'}">${l}</button>`).join('')}</span></nav>
    <section id="portrait"><h2>In short</h2><p class="sec-d">The evaluation, and what it rests on.</p>
      <p class="verdict">${esc(a.verdict)}</p>
      <dl class="stats">
        <div><dt>Prompts read</dt><dd>${num(s.prompts)}</dd></div>
        <div><dt>Days</dt><dd>${num(days.length)}</dd></div>
        <div><dt>Median prompt</dt><dd>${num(s.median_words)} words</dd></div>
        <div><dt>With a screenshot</dt><dd>${num(s.with_image)}</dd></div>
        <div><dt>Refuse or remove</dt><dd>${num(s.refuse_or_remove)}</dd></div>
        <div><dt>Ask for variations</dt><dd>${num(s.asks_for_variations)}</dd></div>
      </dl>
      ${map}${dayChart}
      ${projects}
      <div class="pull"><div data-fam="build"><h3 class="k">${disc}Strongest</h3><p>${esc(a.strongest)}</p></div><div data-fam="ask"><h3 class="k">${disc}Most your own</h3><p>${esc(a.distinctive)}</p></div><div data-fam="edge"><h3 class="k">${disc}Thinnest</h3><p>${esc(a.thinnest)}</p></div></div>
    </section>
    ${SECTIONS.map(([k, title, desc, , f]) => `<section id="${k}" data-fam="${f}"><p class="eyebrow">${disc}${famName[f]}</p><h2>${title}</h2><p class="sec-d">${desc}</p>
      ${k === 'prompting' ? loop : ''}${k === 'metaphors' ? links : ''}
      <div class="grid">${entries(k).map((e, i) => card(k, e, i)).join('')}</div>
      ${k === 'style' ? refusals : ''}</section>`).join('')}
    <section id="vocab"><h2>Vocabulary</h2><p class="sec-d">The interface words you use, counted across your prompts.</p>
      <div class="grid"><div class="it" data-fam="build"><h4>Parts you name</h4>${bars(s.parts)}</div><div class="it" data-fam="ask"><h4>Words for how it should feel</h4>${bars(s.feel)}</div><div class="it" data-fam="edge"><h4>Names you almost never use</h4><p>Each with a picture of what it names.</p>${bars(s.named, 'glyphs')}</div></div>
      ${names}</section>
    <p class="lede" style="margin-top:3rem;font-size:.78rem">Generated ${esc(a.generated)} from ${esc(Object.entries(s.sources || {}).map(([k, v]) => `${v} ${k}`).join(', '))} prompts, on this machine.</p>`;

  // Choosing a level: the card, its square on the map, and what is kept.
  main.addEventListener('click', (ev) => {
    const b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.show) {
      main.dataset.show = b.dataset.show;
      b.parentElement.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
      return;
    }
    const { k, i, v } = b.dataset;
    const cardEl = document.getElementById(`${k}-${i}`);
    cardEl.dataset.level = v;
    cardEl.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    main.querySelectorAll(`[data-cell="${k}:${i}"]`).forEach((cell) => { cell.className = v; });
    const t = main.querySelector(`[data-tally="${k}"]`);
    saved[`${k}:${i}`] = v;
    localStorage.setItem(key, JSON.stringify(saved));
    if (t) t.textContent = tally(k);
  });
})();
</script>
<script>
// The send bar. It shows only when the skill came with a collector.json, and
// it sends only when the report was opened by `send.py --serve`, which is the
// one place on this machine that can post it. Opened as a plain file, the bar
// still says what would go and how to send it. The levels sent are the ones
// left on the page.
(() => {
  const bar = document.getElementById('send');
  const data = JSON.parse(document.getElementById('data').textContent || 'null');
  const conf = JSON.parse(document.getElementById('collector').textContent || 'null');
  if (!bar || !data || !conf) return;
  const a = data.analysis;
  const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const owner = esc(conf.owner || 'Whoever shared this skill');
  const page = esc(conf.page || 'their page');
  const id = `${a.name || ''}:${a.generated || ''}`;
  const sentKey = `ef-sent:${id}`;
  const served = location.protocol === 'http:' && ['127.0.0.1', 'localhost'].includes(location.hostname) && !!conf.token;

  bar.innerHTML = `
    <div class="sheet" id="send-sheet" role="region" aria-labelledby="send-h">
      <h2 id="send-h" tabindex="-1">Before you send</h2>
      <dl>
        <div><dt>What goes</dt><dd>The verdict, the three findings, every entry with the level you left it at and the line of yours behind it, and the counts. ${owner}'s drive makes it a page of its own.</dd></div>
        <div><dt>What never goes</dt><dd>Your prompt history. It stays on this machine.</dd></div>
        <div><dt>Who can read it</dt><dd>Only ${owner}. The link can add your report to ${page} but can't open it, so nobody else who has this skill can read it.</dd></div>
        ${served ? '' : `<div><dt>Sending from this copy</dt><dd>This copy was opened as a file, so it cannot send by itself. Ask your agent to “send my envisioning fluency report”, or run <code>python3 scripts/send.py --work ef-work --serve</code> and press Send in the page it opens.</dd></div>`}
      </dl>
      ${served ? `<label><input type="checkbox" id="send-summary"><span><b>Send only the summary.</b> Your name, the date, the verdict, the three findings, a square per entry, what you are fluent in and your edges, without the quotes.</span></label>` : ''}
    </div>
    <div class="send-row"><p id="send-say" role="status"></p><span id="send-acts" style="display:contents"></span></div>`;
  const say = bar.querySelector('#send-say');
  const acts = bar.querySelector('#send-acts');

  const draw = (state, note) => {
    bar.dataset.state = state;
    say.classList.toggle('err', state === 'error');
    if (state === 'open' || state === 'sending' || state === 'error') bar.setAttribute('data-open', ''); else bar.removeAttribute('data-open');
    if (state === 'sent') {
      const when = note || '';
      say.innerHTML = `Sent to <b>${owner}</b>${when ? ` on ${esc(when)}` : ''}.`;
      acts.innerHTML = conf.link ? `<a class="pill" href="${esc(conf.link)}" target="_blank" rel="noopener">See their page</a>` : '';
    } else if (state === 'closed') {
      say.innerHTML = `<b>${owner}</b> collects these reports. Nothing leaves this machine unless you send it.`;
      acts.innerHTML = `<button type="button" class="pill go" data-do="open" aria-expanded="false" aria-controls="send-sheet">Review and send</button>`;
    } else {
      say.innerHTML = state === 'sending' ? 'Sending…' : state === 'error' ? esc(note) : `Read it through first. You can change any level above before you send.`;
      acts.innerHTML = `<button type="button" class="pill" data-do="close" aria-expanded="true" aria-controls="send-sheet">Not now</button>`
        + (served ? `<button type="button" class="pill go" data-do="send"${state === 'sending' ? ' disabled' : ''}>Send to ${owner}</button>` : '');
    }
  };

  const send = async () => {
    draw('sending');
    let levels = {};
    try { levels = JSON.parse(localStorage.getItem(`ef-levels:${id}`) || '{}'); } catch {}
    try {
      const res = await fetch('/send', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-EF-Token': conf.token },
        body: JSON.stringify({ summary_only: !!bar.querySelector('#send-summary')?.checked, levels }) });
      const out = await res.json().catch(() => ({}));
      if (!res.ok || !out.ok) throw new Error(out.error || `The page did not answer (${res.status}).`);
      const when = new Date().toLocaleDateString(undefined, { day: 'numeric', month: 'long', year: 'numeric' });
      localStorage.setItem(sentKey, when);
      draw('sent', when);
    } catch (err) {
      draw('error', `Not sent. ${err.message.includes('fetch') ? 'The send window has closed; run send.py --serve again.' : err.message}`);
    }
  };

  bar.addEventListener('click', (ev) => {
    const b = ev.target.closest('button[data-do]');
    if (!b) return;
    if (b.dataset.do === 'open') { draw('open'); bar.querySelector('#send-h').focus(); }
    else if (b.dataset.do === 'close') { draw('closed'); bar.querySelector('[data-do="open"]').focus(); }
    else if (b.dataset.do === 'send') send();
  });
  addEventListener('keydown', (ev) => {
    if (ev.key === 'Escape' && bar.dataset.state === 'open') { draw('closed'); bar.querySelector('[data-do="open"]').focus(); }
  });

  const sent = localStorage.getItem(sentKey);
  draw(sent ? 'sent' : 'closed', sent || '');
  bar.hidden = false;
  document.body.classList.add('has-send');
})();
</script>
</body>
</html>
